<div class="flex flex-col gap-4 px-4 py-6 w-fit h-full justify-between">
  <div class="flex flex-col gap-4">
    <div class="flex flex-col gap-2 items-center">
      <img src="Uni-Logo-transparent.png" alt="Uni Logo" class="w-22 h-22" />
      <div class="flex flex-col items-center font-medium text-sm">
        <p>Deutsche Bahn</p>
        <p>Traveller</p>
      </div>
    </div>
    <a
      matButton
      routerLink="/dashboard"
      routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <mat-icon>dashboard</mat-icon>
      Dashboard
    </a>
    <a
      matButton
      routerLink="/analytics"
      routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <mat-icon>analytics</mat-icon>
      Analytics
    </a>
    <a
      matButton
      routerLink="/datasets"
      routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <mat-icon>dataset</mat-icon>
      Datasets
    </a>
    <a
      matButton
      routerLink="/leaderboard"
      routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <mat-icon>leaderboard</mat-icon>
      Leaderboard
    </a>
    <a
      matButton
      routerLink="/profile"
      routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <mat-icon>account_circle</mat-icon>
      Profile
    </a>
    <a
      matButton
      routerLink="/settings"
      routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <mat-icon>settings</mat-icon>
      Settings
    </a>
    <a
      matButton
      routerLink="/login"
      routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <mat-icon>logout</mat-icon>
      Logout
    </a>
  </div>
  <div class="flex flex-row gap-1 justify-evenly">
    <button matMiniFab>
      <mat-icon>language</mat-icon>
    </button>
    <button matMiniFab>
      <mat-icon>dark_mode</mat-icon>
    </button>
  </div>
</div>
