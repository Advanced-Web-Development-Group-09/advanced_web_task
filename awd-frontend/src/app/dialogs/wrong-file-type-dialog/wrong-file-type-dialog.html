<h2 mat-dialog-title>{{ 'DIALOG.INVALID_FILE_TYPE' | translate }}</h2>
<mat-dialog-content>
  <div class="flex flex-col gap-4">
    <p class="text-lg" style="color: var(--mat-sys-on-surface)">
      {{ 'DIALOG.FILE_CANNOT_BE_PROCESSED' | translate }}
    </p>
    <div class="pt-2">
      <p class="mb-2 text-base" style="color: var(--mat-sys-on-surface-variant)">
        {{ 'DIALOG.ACCEPTED_FORMATS' | translate }}
      </p>
      <p class="ml-4 font-medium text-base" style="color: var(--mat-sys-on-surface)">
        {{ 'DIALOG.FORMATS_LIST' | translate }}
      </p>
    </div>
    <p class="pt-2 text-base" style="color: var(--mat-sys-on-surface-variant)">
      {{ 'DIALOG.VERIFY_FILE_TYPE' | translate }}
    </p>
  </div>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton mat-dialog-close cdkFocusInitial>{{ 'CLOSE' | translate }}</button>
</mat-dialog-actions>
