<div class="flex">
  <img class="h-screen" src="DB-Background.png" alt="DB Image" />
  <div class="flex items-center justify-center flex-1 w-fit">
    <div class="flex flex-col gap-4">
      <p class="text-4xl font-medium" style="color: var(--mat-sys-on-background)">
        {{ 'LOGIN' | translate }}
      </p>
      <p style="color: var(--mat-sys-on-background)">
        {{ 'REQUIRED_FIELDS' | translate }}
      </p>
      <form class="flex flex-col gap-4">
        <mat-form-field>
          <mat-label>{{ 'EMAIL' | translate }}</mat-label>
          <input matInput />
        </mat-form-field>
        <mat-form-field>
          <mat-label>{{ 'PASSWORD' | translate }}</mat-label>
          <input matInput />
        </mat-form-field>
      </form>

      <a matButton="filled" class="w-25 button-color" routerLink="/dashboard">
        {{ 'LOGIN' | translate }}
      </a>
      <p>
        {{ 'NO_ACCOUNT' | translate }}
        <a routerLink="/registration" class="font-medium">{{ 'SIGN_UP_INFO' | translate }}</a>
      </p>
    </div>
  </div>
  <div class="absolute top-4 right-4 flex flex-row gap-2">
    <button matMiniFab (click)="toggleLanguage()">
      <mat-icon>language</mat-icon>
    </button>
    <button matMiniFab (click)="toggleDarkMode()">
      <mat-icon>{{ isDarkMode == 'light' ? 'dark_mode' : 'light_mode' }}</mat-icon>
    </button>
  </div>
</div>
