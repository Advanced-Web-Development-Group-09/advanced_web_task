<div class="flex">
  <img class="h-screen" src="DB-Background.png" alt="DB Image" />
  <div class="flex items-center justify-center flex-1 w-fit">
    <div class="flex flex-col gap-4">
      <p class="text-4xl font-medium" style="color: var(--mat-sys-on-surface)">
        {{ 'SIGN_UP' | translate }}
      </p>
      <p style="color: var(--mat-sys-on-surface)">{{ 'REQUIRED_FIELDS' | translate }}</p>
      <form class="flex flex-col gap-4">
        <mat-form-field>
          <mat-label>{{ 'USERNAME' | translate }}</mat-label>
          <input matInput />
        </mat-form-field>
        <mat-form-field>
          <mat-label>{{ 'EMAIL' | translate }}</mat-label>
          <input matInput />
        </mat-form-field>
        <mat-form-field>
          <mat-label>{{ 'PASSWORD' | translate }}</mat-label>
          <input matInput type="password" />
        </mat-form-field>
      </form>

      <a matButton="filled" class="w-25" routerLink="/dashboard">{{ 'SIGN_UP' | translate }}</a>
      <p style="color: var(--mat-sys-on-surface)">
        {{ 'ALREADY_HAVE_ACCOUNT' | translate }}
        <a routerLink="/login" class="font-medium">{{ 'LOGIN_INFO' | translate }}</a>
      </p>
    </div>
  </div>
</div>
